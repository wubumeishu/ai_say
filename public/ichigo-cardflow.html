<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ai SAY · 卡片流</title>
<style>
:root{--bg:#0f1117;--bg2:#151823;--panel:#1a1d27;--panel2:#22252f;--border:#2d3140;--text:#e8eaed;--muted:#aeb4c2;--accent:#4f8cff;--card:#1a1d27;--orange:#fb923c;--purple:#a78bfa;--yellow:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI","Hiragino Sans",system-ui,sans-serif;font-size:14px}
#topbar{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border)}
#topbar a{color:var(--accent);text-decoration:none;font-size:13px;display:inline-flex;align-items:center;padding:4px 8px;min-height:24px;min-width:24px}
#topbar .title{font-weight:700;font-size:15px}
#topbar .hint{font-size:12px;color:var(--muted);margin-left:auto}
#cardPage{position:fixed;top:48px;left:0;right:0;bottom:0;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.cf-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.cf-grid{flex:1;display:grid;grid-template-columns:280px 1fr 420px;overflow:hidden;min-height:0}
.cf-col{min-height:0;overflow-y:auto;padding:10px 12px}
.cf-left{background:rgba(26,29,39,.4);border-right:1px solid var(--border)}
.cf-mid{background:var(--panel)}
.cf-right{background:rgba(26,29,39,.4);border-left:1px solid var(--border)}
.cf-plate{background:var(--panel2);border-radius:10px;padding:10px 12px;margin-bottom:9px;border:1px solid transparent;transition:border-color .15s}
.cf-plate:hover{border-color:var(--border)}
.cf-plate h4{font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:600}
.cf-badge{display:inline-block;font-size:12px;padding:1px 7px;border-radius:4px;margin-right:4px}
.cf-badge.ichigo{background:rgba(79,140,255,.15);color:#8fb6ff}
.cf-badge.happymail{background:rgba(52,195,143,.15);color:#34c38f}
.cf-badge.no-rev{background:rgba(239,68,68,.15);color:#ff8f8f}
.cf-badge.rev{background:rgba(52,195,143,.15);color:#34c38f}
.cf-tag{display:inline-block;background:var(--panel2);border-radius:4px;padding:1px 6px;font-size:12px;color:var(--muted);margin:2px 4px 0 0}
.cf-ai{background:var(--panel2);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.cf-ai h5{font-size:11px;color:var(--purple);margin:0 0 4px;font-weight:600}
.cf-ai p{font-size:12px;line-height:1.5;margin:0}
.cf-chat{background:var(--panel2);border-radius:8px;padding:8px 10px}
.cf-chat h5{font-size:11px;color:var(--muted);margin:0 0 6px}
.cf-mline{margin-bottom:7px;font-size:12px;line-height:1.4}
.cf-jp{color:var(--text)}
.cf-zh{color:var(--accent);font-size:12px;margin-top:2px;padding-left:8px;border-left:2px solid rgba(79,140,255,.3)}
.cf-t{color:var(--muted);font-size:12px;margin-top:2px}
.cf-talk{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.cf-talk.sel{border-color:var(--accent);background:rgba(79,140,255,.12)}
.cf-talkhead{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.cf-key{font-size:14px;font-weight:800;color:var(--accent);width:18px}
.cf-intent{font-size:11px;color:var(--orange);flex:1}
.cf-conf{font-size:10px;color:var(--muted)}
.cf-progress{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--panel);border-top:1px solid var(--border)}
.cf-bar{flex:1;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
.cf-bar div{height:100%;background:var(--accent);transition:width .3s}
.cf-toolbar{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--panel);border-top:1px solid var(--border)}
.cf-hint{font-size:10px;color:var(--muted)}
.cf-hint kbd{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:monospace}
.cf-queue{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;max-width:60%}
.cf-qitem{display:flex;align-items:center;gap:5px;font-size:11px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:3px 8px}
.cf-timer{color:var(--yellow);font-weight:700}
.cf-cancel{color:var(--muted);cursor:pointer;font-size:10px}
.cf-cancel:hover{color:#ef4444}
.cf-rev{color:#34c38f;cursor:pointer;font-size:10px;margin-left:4px}
.cf-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;display:none;align-items:center;justify-content:center}
.cf-overlay.show{display:flex}
.cf-overlay .box{background:var(--panel2);border-radius:10px;padding:20px 24px;max-width:420px}
.cf-overlay h3{margin:0 0 10px;font-size:15px}
.cf-overlay p{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 14px}
.cf-overlay .row{display:flex;gap:10px;justify-content:flex-end}
.cf-overlay button{font-size:13px;padding:6px 16px;border-radius:6px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text)}
.cf-overlay button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.cf-filterbar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap;padding:0 12px}
.cf-filterbar .cfFilt{font-size:12px;padding:3px 12px;border-radius:14px;cursor:pointer;border:1px solid var(--border,#2a3550);background:var(--card,#1a1d27);color:var(--text);margin:0}
</style>
</head>
<body>
<div id="topbar">
  <span class="title">⚡ 卡片流（批处理）</span>
  <a href="/ichigo-console">← 返回控制台</a>
  <span class="hint" id="cfTopHint">加载候选中…</span>
</div>
<div id="cardPage">
  <div class="cf-main"><div style="text-align:center;padding:60px;color:var(--muted,#8b8fa3);font-size:13px">⏳ 卡片流加载中…（拉取候选）</div></div>
</div>
<!-- overlay -->
<div class="cf-overlay" id="cfBlockOverlay"><div class="box"><h3 id="cfBlockTitle"></h3><p id="cfBlockBody"></p><div class="row"><button id="cfBlockCancel">取消</button><button id="cfBlockConfirm" class="primary">确认</button></div></div></div>
<div class="cf-overlay" id="cfAdjustOverlay"><div class="box"><h3>微调话术</h3><p id="cfAdjustBody"></p><div class="row"><button id="cfAdjustCancel">取消</button><button id="cfAdjustGo" class="primary">生成</button></div></div></div>

<script type="module">
// 独立卡片流页 · 直接 import cardflow.js(带版本号, 浏览器视为全新模块, 无主 HTML 缓存污染)
(function() {
  var hint = document.getElementById('cfTopHint');
  var status = { loading: true, error: '', loaded: false };
  import('/ichigo-assets/cardflow.js?v=20261112b').then(function(cf) {
    // 把 cardflow.js 的全局桥接挂上(它内部用 window 还是 export? 它是 ESM, render 等通过 export)
    // cardflow.js 的 render/loadLeads 是 export, 直接调用
    cf.startQueueTick && cf.startQueueTick();
    cf.loadLeads();
    // overlay 绑定
    var bc = document.getElementById('cfBlockCancel');
    var bco = document.getElementById('cfBlockConfirm');
    var ac = document.getElementById('cfAdjustCancel');
    var ago = document.getElementById('cfAdjustGo');
    if (bc && cf.cancelBlock) bc.onclick = function() { cf.cancelBlock(); };
    if (bco && cf.confirmBlock) bco.onclick = function() { cf.confirmBlock(); };
    if (ac && cf.cancelAdjust) ac.onclick = function() { cf.cancelAdjust(); };
    if (ago && cf.doAdjust) ago.onclick = function() { cf.doAdjust(); };
    status = { loading: false, error: '', loaded: true };
    if (hint) hint.textContent = '就绪 · ' + (cf ? '模块加载成功' : '');
  }).catch(function(err) {
    status = { loading: false, error: String((err && err.message) || err), loaded: false };
    var cp = document.getElementById('cardPage');
    if (cp) cp.innerHTML = '<div class="cf-main"><div style="text-align:center;padding:60px;color:#ef4444;font-size:13px">卡片流模块加载失败: ' + status.error +
      '<br><span style="color:var(--muted,#8b8fa3);font-size:12px">请 Ctrl+Shift+R 强刷本页, 或检查 /ichigo-assets/cardflow.js 是否 200</span></div></div>';
    if (hint) hint.textContent = '模块加载失败';
  });
})();
</script>
</body>
</html>
