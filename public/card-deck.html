<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>卡片交互原型 · 出会平台</title>
<style>
:root{--bg:#0f1117;--panel:#1a1d27;--panel2:#22252f;--border:#2d3140;--text:#e8eaed;--muted:#8b8fa3;--accent:#4f8cff;--green:#34c38f;--red:#ef4444;--yellow:#fbbf24;--purple:#a78bfa;--orange:#fb923c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui;font-size:14px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:200px;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.sidebar h1{font-size:15px;padding:14px 16px;border-bottom:1px solid var(--border);color:var(--accent)}
.sidebar .keys{padding:12px 16px;font-size:12px;line-height:2;color:var(--muted)}
.sidebar kbd{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:monospace;font-size:11px;color:var(--accent)}
.queue-panel{margin:8px 12px;background:var(--panel2);border-radius:8px;border:1px solid var(--border);flex:1;overflow-y:auto}
.queue-panel h3{font-size:13px;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--orange)}
.queue-item{padding:6px 12px;font-size:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.queue-item:last-child{border-bottom:none}
.qstatus.queued{color:var(--yellow)}.qstatus.sent{color:var(--green)}.qstatus.skipped{color:var(--muted);text-decoration:line-through}.qstatus.blocked{color:var(--red)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.progress{background:var(--panel);padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.progress .lbl{font-size:12px;color:var(--muted)}
.progress .bar{flex:1;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
.progress .bar div{height:100%;background:var(--accent);transition:width .3s}
.card-deck{flex:1;overflow-y:auto;padding:16px}
.card{background:var(--panel);border:2px solid var(--accent);border-radius:10px;padding:16px}
.card-block{display:flex;gap:16px}
.card-left{width:180px;flex-shrink:0}
.avatar-row{display:flex;gap:6px;margin-bottom:8px}
.avatar{width:40px;height:40px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}
.platform-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;margin-bottom:8px}
.platform-badge.ichigo{background:rgba(79,140,255,.15);color:var(--accent)}
.no-revoke{font-size:11px;color:var(--red);margin-top:4px}
.card-mid{flex:1;min-width:0}
.card-mid h4{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status-badge{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:400}
.status-badge.pending{background:var(--panel2);color:var(--muted)}
.status-badge.drafted{background:rgba(251,191,36,.15);color:var(--yellow)}
.status-badge.sent{background:rgba(52,195,143,.15);color:var(--green)}
.status-badge.skipped{background:rgba(139,143,163,.15);color:var(--muted)}
.status-badge.blocked{background:rgba(239,68,68,.15);color:var(--red)}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.profile-cell{background:var(--panel2);border-radius:6px;padding:8px 10px}
.profile-cell h5{font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.profile-cell p{font-size:12px;line-height:1.5}
.tag{display:inline-block;background:var(--panel2);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--muted);margin-right:4px}
.ai-section{background:var(--panel2);border-radius:6px;padding:10px;margin-bottom:8px}
.ai-section h5{font-size:12px;color:var(--purple);margin-bottom:6px}
.ai-section p{font-size:12px;line-height:1.6}
.chat-history{background:var(--panel2);border-radius:6px;padding:10px;margin-bottom:8px;max-height:120px;overflow-y:auto}
.chat-history h5{font-size:12px;color:var(--muted);margin-bottom:6px}
.msg{margin-bottom:8px;padding:6px 8px;border-radius:6px;font-size:12px}
.msg.recv{background:rgba(79,140,255,.08);border-left:3px solid var(--accent)}
.msg.send{background:rgba(52,195,143,.08);border-left:3px solid var(--green);margin-left:25%}
.msg .jp{margin-bottom:2px}.msg .zh{color:var(--muted);font-size:11px}.msg .time{color:var(--muted);font-size:10px;margin-top:2px}
.talks{margin-bottom:8px}
.talks h5{font-size:12px;color:var(--orange);margin-bottom:8px}
.talk{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:6px;margin-bottom:6px;border:1px solid transparent}
.talk.selected{border-color:var(--accent);background:rgba(79,140,255,.1)}
.talk .key{font-size:16px;font-weight:700;color:var(--accent);width:24px;flex-shrink:0}
.talk .content{flex:1}
.talk .jp{font-size:14px;margin-bottom:2px}
.talk .zh{font-size:12px;color:var(--muted)}
.toolbar{background:var(--panel);border-top:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.toolbar kbd{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-family:monospace;font-size:11px;color:var(--accent)}
.toolbar .hint{font-size:11px;color:var(--muted)}
.queue-stats{margin-left:auto;font-size:12px;color:var(--muted)}
.queue-stats span{color:var(--yellow)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center}
.overlay.hidden{display:none}
.confirm-box{background:var(--panel);border:2px solid var(--red);border-radius:12px;padding:24px 32px;text-align:center;max-width:360px}
.confirm-box h2{color:var(--red);font-size:18px;margin-bottom:12px}
.confirm-box p{color:var(--muted);font-size:13px;margin-bottom:16px;line-height:1.5}
.confirm-box .target{font-size:14px;color:var(--text);margin-bottom:16px}
.confirm-box .keys{font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>出会 · 键盘驱动</h1>
    <div class="keys">
      <div style="margin-bottom:8px"><strong style="color:var(--text)">选话术（→待发送）</strong></div>
      <div><kbd>A</kbd> 话术A &nbsp; <kbd>B</kbd> 话术B</div>
      <div><kbd>C</kbd> 话术C &nbsp; <kbd>D</kbd> 话术D</div>
      <div style="margin:12px 0 8px"><strong style="color:var(--text)">处置</strong></div>
      <div><kbd>1</kbd> 标记 &nbsp; <kbd>2</kbd> 拉黑</div>
      <div><kbd>3</kbd> 跳过 &nbsp; <kbd>4</kbd> 重新生成</div>
      <div><kbd>5</kbd> AI对话 &nbsp; <kbd>6</kbd> 展开</div>
      <div style="margin:12px 0 8px"><strong style="color:var(--text)">导航</strong></div>
      <div><kbd>→</kbd>/<kbd>Space</kbd> 下一张</div>
      <div><kbd>←</kbd> 上一张</div>
      <div style="margin:12px 0 8px"><strong style="color:var(--text)">拉黑确认</strong></div>
      <div><kbd>Y</kbd> 确认 &nbsp; <kbd>Esc</kbd> 取消</div>
    </div>
    <div class="queue-panel" id="queuePanel"></div>
  </aside>
  <div class="main">
    <div class="progress">
      <span class="lbl" id="progress">1 / 5</span>
      <div class="bar"><div id="progressBar" style="width:0%"></div></div>
      <span id="queueStats"></span>
    </div>
    <div class="card-deck" id="cardDeck"></div>
    <div class="toolbar">
      <span class="hint"><kbd>A</kbd>~<kbd>D</kbd> 选话术入待发送（自动滑卡）&nbsp; <kbd>1</kbd>标记 <kbd>2</kbd>拉黑 <kbd>3</kbd>跳过 <kbd>4</kbd>重生成 <kbd>5</kbd>AI对话 <kbd>6</kbd>展开</span>
    </div>
  </div>
</div>
<div class="overlay hidden" id="blockOverlay">
  <div class="confirm-box">
    <h2>⚠ 确认拉黑</h2>
    <p>拉黑后对方无法再给你发消息/点赞。<br>出会平台为强副作用，确认后不可立即撤销。</p>
    <div class="target">目标：<strong id="blockTargetName"></strong></div>
    <div class="keys">按 <kbd>Y</kbd> 确认拉黑 · <kbd>Esc</kbd> 取消</div>
  </div>
</div>
<script src="card-deck.js"></script>
</body>
</html>
