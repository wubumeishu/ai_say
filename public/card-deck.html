<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>卡片流 · 出会 + 快乐 双平台</title>
<style>
:root{--bg:#0f1117;--panel:#1a1d27;--panel2:#22252f;--border:#2d3140;--text:#e8eaed;--muted:#8b8fa3;--accent:#4f8cff;--green:#34c38f;--red:#ef4444;--yellow:#fbbf24;--purple:#a78bfa;--orange:#fb923c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:system-ui;font-size:13px}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* 顶部全局状态栏 */
.topbar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-size:13px;font-weight:700;color:var(--accent);margin-right:6px}
.win-pill{display:flex;align-items:center;gap:5px;font-size:11px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:3px 10px}
.win-pill .dot{width:8px;height:8px;border-radius:50%}
.win-pill.open .dot{background:var(--green)}
.win-pill.closed .dot{background:var(--muted)}
.win-pill span.lbl{color:var(--muted)}
.queue-strip{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.queue-strip .count{color:var(--yellow);font-weight:700}
.queue-strip .next{color:var(--accent)}
.alert-strip{background:rgba(251,191,36,.15);color:var(--yellow);font-size:11px;padding:2px 10px;border-radius:4px}

/* 主体: 高密度三栏(260 + 1fr + 420) */
.body{flex:1;display:grid;grid-template-columns:260px 1fr 420px;overflow:hidden;min-height:0}
.col{padding:10px 12px;overflow-y:auto;min-height:0}
.col.left{background:rgba(26,29,39,.4);border-right:1px solid var(--border)}
.col.mid{background:var(--panel)}
.col.right{background:rgba(26,29,39,.4);border-left:1px solid var(--border)}

/* 左栏: 人设与资料对照 */
.plate{background:var(--panel2);border-radius:8px;padding:10px;margin-bottom:10px}
.plate h4{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600}
.plate .n{font-size:15px;font-weight:700}
.plate .m{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.6}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:4px;margin-right:4px}
.badge.ichigo{background:rgba(79,140,255,.15);color:var(--accent)}
.badge.happymail{background:rgba(52,195,143,.15);color:var(--green)}
.badge.no-revoke{background:rgba(239,68,68,.15);color:var(--red)}
.badge.revoke{background:rgba(52,195,143,.15);color:var(--green)}
.tag{display:inline-block;background:var(--panel2);border-radius:4px;padding:1px 6px;font-size:10px;color:var(--muted);margin:0 4px 3px 0}
.interests{margin-top:6px}

/* 中栏: 紧凑分析 + 最近 5 条双语 */
.ai-box{background:var(--panel2);border-radius:8px;padding:9px 11px;margin-bottom:8px}
.ai-box h5{font-size:11px;color:var(--purple);margin-bottom:4px;font-weight:600}
.ai-box p{font-size:12px;line-height:1.5;color:var(--text)}
.chat{background:var(--panel2);border-radius:8px;padding:8px 10px}
.chat h5{font-size:11px;color:var(--muted);margin-bottom:6px}
.mline{margin-bottom:7px;font-size:11px;line-height:1.4}
.mline .jp{color:var(--text)}
.mline .zh{color:var(--accent);font-size:11px;margin-top:2px;padding-left:8px;border-left:2px solid rgba(79,140,255,.3)}
.mline .t{color:var(--muted);font-size:10px;margin-top:2px}
.empty{color:var(--muted);font-size:11px;padding:14px;text-align:center}

/* 右栏: A~D 大卡 */
.talk{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:default}
.talk.sel{border-color:var(--accent);background:rgba(79,140,255,.12)}
.talk .head{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.talk .key{font-size:15px;font-weight:800;color:var(--accent);width:20px}
.talk .intent{font-size:11px;color:var(--orange);flex:1}
.talk .conf{font-size:10px;color:var(--muted)}
.talk .jp{font-size:12.5px;font-weight:500;line-height:1.45}
.talk .zh{font-size:11px;color:var(--accent);margin-top:4px;background:rgba(79,140,255,.06);padding:3px 7px;border-radius:4px}

/* 底部快捷键 + 队列倒计时条 */
.bottombar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--panel);border-top:1px solid var(--border);flex-shrink:0}
.bottombar .hint{font-size:10px;color:var(--muted)}
.bottombar kbd{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:monospace;font-size:10px;color:var(--accent)}
.qbar{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;max-width:60%}
.qitem{display:flex;align-items:center;gap:5px;font-size:11px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:3px 9px}
.qitem .timer{color:var(--yellow);font-weight:700}
.qitem .cancel{color:var(--muted);cursor:pointer;font-size:10px}
.qitem .cancel:hover{color:var(--red)}
.qitem .revoke{color:var(--green);cursor:pointer;font-size:10px;margin-left:4px}

/* 拉黑确认层 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.confirm-box{background:var(--panel);border:2px solid var(--red);border-radius:12px;padding:22px 30px;text-align:center;max-width:340px}
.confirm-box h2{color:var(--red);font-size:15px;margin-bottom:10px}
.confirm-box p{color:var(--muted);font-size:12px;margin-bottom:14px;line-height:1.5}
.confirm-box .target{font-size:13px;color:var(--text);margin-bottom:14px}
.confirm-box .keys{font-size:11px;color:var(--muted);margin-top:10px}
.confirm-box button{background:var(--red);color:#fff;border:none;border-radius:6px;padding:7px 18px;font-size:12px;cursor:pointer;margin:0 4px}
.confirm-box button.cancel{background:var(--panel2);color:var(--muted)}

/* 微调弹窗 */
.adjust-box{background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:22px 30px;max-width:440px;text-align:left}
.adjust-box h2{color:var(--accent);font-size:15px;margin-bottom:10px}
.adjust-box textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px;resize:vertical;min-height:50px}
.adjust-box .row{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.adjust-box button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:7px 16px;font-size:12px;cursor:pointer}
.adjust-box button.cancel{background:var(--panel2);color:var(--muted)}
.loading{color:var(--muted);font-size:12px;padding:10px}
</style>
</head>
<body>
<div class="app">
  <!-- 顶部全局状态栏 -->
  <div class="topbar">
    <span class="brand">⚡ 卡片流</span>
    <div class="win-pill closed" id="win17098"><span class="dot"></span><span class="lbl">出会 17098</span></div>
    <div class="win-pill closed" id="win18595"><span class="dot"></span><span class="lbl">快乐 18595</span></div>
    <div id="alertStrip" style="display:none"></div>
    <div class="queue-strip">
      <span>⏳ 待发送 <span class="count" id="qCount">0</span></span>
      <span class="next" id="qNext"></span>
    </div>
  </div>

  <!-- 三栏主体 -->
  <div class="body">
    <div class="col left" id="colLeft"></div>
    <div class="col mid" id="colMid"></div>
    <div class="col right" id="colRight"></div>
  </div>

  <!-- 底部快捷键 + 队列条 -->
  <div class="bottombar">
    <span class="hint"><kbd>A</kbd>~<kbd>D</kbd> 选话术入队 · <kbd>1</kbd> 标记 <kbd>2</kbd> 拉黑 <kbd>3</kbd> 跳过 <kbd>4</kbd> 重生成 <kbd>5</kbd> 微调 <kbd>6</kbd> 展开 · <kbd>→</kbd> 下一张 <kbd>←</kbd> 上一张</span>
    <div class="qbar" id="qbar"></div>
  </div>
</div>

<!-- 拉黑确认层 -->
<div class="overlay" id="blockOverlay">
  <div class="confirm-box">
    <h2>⚠ 确认拉黑</h2>
    <p>拉黑后对方无法再给你发消息/点赞。<br>出会平台为强副作用，确认后不可立即撤销。</p>
    <div class="target">目标：<strong id="blockTargetName"></strong></div>
    <button class="cancel" onclick="cancelBlock()">取消 (Esc)</button>
    <button onclick="confirmBlock()">确认拉黑 (Y)</button>
    <div class="keys">按 <kbd>Y</kbd> 确认 · <kbd>Esc</kbd> 取消</div>
  </div>
</div>

<!-- 微调弹窗 -->
<div class="overlay" id="adjustOverlay">
  <div class="adjust-box">
    <h2>🤖 AI 对话微调话术</h2>
    <p style="color:var(--muted);font-size:12px;margin-bottom:8px">给个指令，AI 重写 A~D（如「从温泉切入、更温和一点」）</p>
    <textarea id="adjustNote" placeholder="输入微调指令…"></textarea>
    <div class="row">
      <button class="cancel" onclick="cancelAdjust()">取消</button>
      <button onclick="doAdjust()">重新生成</button>
    </div>
  </div>
</div>

<script src="card-deck.js"></script>
</body>
</html>
