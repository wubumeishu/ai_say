<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>卡片交互原型 · 出会平台</title>
<style>
:root{--bg:#0f1117;--panel:#1a1d27;--panel2:#22252f;--border:#2d3140;--text:#e8eaed;--muted:#8b8fa3;--accent:#4f8cff;--green:#34c38f;--red:#ef4444;--yellow:#fbbf24;--purple:#a78bfa;--orange:#fb923c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:system-ui;font-size:13px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:190px;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.sidebar h1{font-size:14px;padding:12px 14px;border-bottom:1px solid var(--border);color:var(--accent)}
.sidebar .keys{padding:10px 14px;font-size:11px;line-height:1.9;color:var(--muted)}
.sidebar kbd{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:monospace;font-size:10px;color:var(--accent)}
.queue-panel{margin:6px 10px;background:var(--panel2);border-radius:8px;border:1px solid var(--border);flex:1;overflow-y:auto}
.queue-panel h3{font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);color:var(--orange)}
.queue-item{padding:5px 10px;font-size:11px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.queue-item:last-child{border-bottom:none}
.qstatus.queued{color:var(--yellow)}.qstatus.sent{color:var(--green)}.qstatus.skipped{color:var(--muted);text-decoration:line-through}.qstatus.blocked{color:var(--red)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.progress{background:var(--panel);padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.progress .lbl{font-size:11px;color:var(--muted)}
.progress .bar{flex:1;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
.progress .bar div{height:100%;background:var(--accent);transition:width .3s}
.card-deck{flex:1;overflow:hidden;padding:10px}
.card.single{background:var(--panel);border:2px solid var(--accent);border-radius:10px;height:100%;overflow:hidden;display:flex;flex-direction:column}
.rec-banner{background:linear-gradient(90deg,rgba(79,140,255,.25),rgba(167,139,250,.15));border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.rec-banner .rb-label{font-size:12px;color:var(--accent);font-weight:700}
.rec-banner .rb-key{font-size:16px;font-weight:800;color:#fff;background:var(--accent);border-radius:6px;padding:1px 9px}
.rec-banner .rb-text{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-banner .rb-conf{font-size:11px;color:var(--muted)}
.rec-banner .rb-hint{font-size:11px;color:var(--yellow)}
.card-body{flex:1;display:grid;grid-template-columns:200px 1fr 300px;gap:0;overflow:hidden}
.card-col{padding:10px 12px;overflow-y:auto}
.col-left{border-right:1px solid var(--border);background:rgba(26,29,39,.4)}
.col-mid{background:var(--panel)}
.col-right{border-left:1px solid var(--border);background:rgba(26,29,39,.4)}
.platform-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;margin-bottom:6px}
.platform-badge.ichigo{background:rgba(79,140,255,.15);color:var(--accent)}
.src-badge{font-size:10px;color:var(--muted);margin-left:6px}
.avatar-row{display:flex;gap:5px;margin-bottom:6px}
.avatar{width:36px;height:36px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted)}
.online-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:6px}
.online-dot.tier1{background:var(--green)}.online-dot.tier2{background:var(--yellow)}.online-dot.tier3{background:var(--muted)}.online-dot.tier4{background:var(--muted)}
.no-revoke{font-size:10px;color:var(--red);margin-top:4px}
.who{margin-top:8px}
.who-name{font-size:18px;font-weight:700}
.who-meta{font-size:12px;color:var(--muted);margin:4px 0}
.status-badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:400}
.status-badge.pending{background:var(--panel2);color:var(--muted)}
.status-badge.drafted{background:rgba(251,191,36,.15);color:var(--yellow)}
.status-badge.sent{background:rgba(52,195,143,.15);color:var(--green)}
.status-badge.skipped{background:rgba(139,143,163,.15);color:var(--muted)}
.status-badge.blocked{background:rgba(239,68,68,.15);color:var(--red)}
.last-msg{margin-top:10px;background:var(--panel2);border-radius:6px;padding:8px;border-left:3px solid var(--accent)}
.last-msg .lm-jp{font-size:12px;line-height:1.4}
.last-msg .lm-zh{font-size:11px;color:var(--muted);margin-top:3px}
.last-msg .lm-time{font-size:10px;color:var(--muted);margin-top:4px}
.profile-cell{background:var(--panel2);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.profile-cell h5{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
.profile-cell p{font-size:12px;line-height:1.5}
.profile-cell .intro{color:var(--text);margin-top:4px}
.profile-cell .traits{color:var(--muted);margin-top:4px}
.tag{display:inline-block;background:var(--panel2);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--muted);margin-right:4px}
.ai-section{background:var(--panel2);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.ai-section h5{font-size:11px;color:var(--purple);margin-bottom:4px}
.ai-section p{font-size:12px;line-height:1.5}
.chat-history{background:var(--panel2);border-radius:6px;padding:8px 10px;margin-bottom:8px;max-height:120px;overflow-y:auto}
.chat-history h5{font-size:11px;color:var(--muted);margin-bottom:4px}
.msg{margin-bottom:6px;padding:5px 8px;border-radius:6px;font-size:11px}
.msg.recv{background:rgba(79,140,255,.08);border-left:3px solid var(--accent)}
.msg .jp{margin-bottom:2px}.msg .zh{color:var(--muted);font-size:10px}.msg .time{color:var(--muted);font-size:9px}
.talks h5{font-size:11px;color:var(--orange);margin-bottom:8px}
.talk{display:flex;align-items:flex-start;gap:8px;padding:8px;border-radius:6px;margin-bottom:6px;border:1px solid transparent;cursor:default}
.talk.selected{border-color:var(--accent);background:rgba(79,140,255,.12)}
.talk .key{font-size:14px;font-weight:800;color:var(--accent);width:20px;flex-shrink:0}
.talk .content{flex:1;min-width:0}
.talk .jp{font-size:12px;margin-bottom:2px;line-height:1.4}
.talk .zh{font-size:11px;color:var(--muted)}
.toolbar{background:var(--panel);border-top:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.toolbar kbd{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:monospace;font-size:10px;color:var(--accent)}
.toolbar .hint{font-size:10px;color:var(--muted)}
.queue-stats{margin-left:auto;font-size:11px;color:var(--muted)}
.queue-stats span{color:var(--yellow)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center}
.overlay.hidden{display:none}
.confirm-box{background:var(--panel);border:2px solid var(--red);border-radius:12px;padding:24px 32px;text-align:center;max-width:340px}
.confirm-box h2{color:var(--red);font-size:16px;margin-bottom:10px}
.confirm-box p{color:var(--muted);font-size:12px;margin-bottom:14px;line-height:1.5}
.confirm-box .target{font-size:13px;color:var(--text);margin-bottom:14px}
.confirm-box .keys{font-size:11px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>出会 · 键盘驱动</h1>
    <div class="keys">
      <div style="margin-bottom:8px"><strong style="color:var(--text)">选话术（→待发送）</strong></div>
      <div><kbd>A</kbd> 话术A &nbsp; <kbd>B</kbd> 话术B</div>
      <div><kbd>C</kbd> 话术C &nbsp; <kbd>D</kbd> 话术D</div>
      <div style="margin:12px 0 8px"><strong style="color:var(--text)">处置</strong></div>
      <div><kbd>1</kbd> 标记 &nbsp; <kbd>2</kbd> 拉黑</div>
      <div><kbd>3</kbd> 跳过 &nbsp; <kbd>4</kbd> 重新生成</div>
      <div><kbd>5</kbd> AI对话 &nbsp; <kbd>6</kbd> 展开</div>
      <div style="margin:12px 0 8px"><strong style="color:var(--text)">导航</strong></div>
      <div><kbd>→</kbd>/<kbd>Space</kbd> 下一张</div>
      <div><kbd>←</kbd> 上一张</div>
      <div style="margin:12px 0 8px"><strong style="color:var(--text)">拉黑确认</strong></div>
      <div><kbd>Y</kbd> 确认 &nbsp; <kbd>Esc</kbd> 取消</div>
    </div>
    <div class="queue-panel" id="queuePanel"></div>
  </aside>
  <div class="main">
    <div class="progress">
      <span class="lbl" id="progress">1 / 5</span>
      <div class="bar"><div id="progressBar" style="width:0%"></div></div>
      <span id="queueStats"></span>
    </div>
    <div class="card-deck" id="cardDeck"></div>
    <div class="toolbar">
      <span class="hint"><kbd>A</kbd>~<kbd>D</kbd> 选话术入待发送（自动滑卡）&nbsp; <kbd>1</kbd>标记 <kbd>2</kbd>拉黑 <kbd>3</kbd>跳过 <kbd>4</kbd>重生成 <kbd>5</kbd>AI对话 <kbd>6</kbd>展开</span>
    </div>
  </div>
</div>
<div class="overlay hidden" id="blockOverlay">
  <div class="confirm-box">
    <h2>⚠ 确认拉黑</h2>
    <p>拉黑后对方无法再给你发消息/点赞。<br>出会平台为强副作用，确认后不可立即撤销。</p>
    <div class="target">目标：<strong id="blockTargetName"></strong></div>
    <div class="keys">按 <kbd>Y</kbd> 确认拉黑 · <kbd>Esc</kbd> 取消</div>
  </div>
</div>
<script src="card-deck.js"></script>
</body>
</html>
