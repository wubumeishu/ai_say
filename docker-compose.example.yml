# Ai SAY · 容器化部署（task-6 · 终极蓝图 §-1.1 群控基座预留）
#
# 定位：当前单实例 = 现形态容器化；多账号群控 = 复制 service 段，改 name/ports/数据卷。
# 比特浏览器 + CDP 在宿主机；容器经 host.docker.internal 回连 54346。
# 复制为 docker-compose.yml 后按需改：settings.json 路径、端口、BIT_BROWSER_API_URL。
#
# 启动：docker compose -f docker-compose.example.yml up -d --build
# 群控多实例：见文末「群控多实例预留」注释块（data 目录参数化改造后启用）。
services:
  ai-say:
    build: .
    image: aisay/ai-say:latest
    container_name: ai-say
    # 崩溃自重启 + 宿主机重启后自动拉起（群控基座 HA 基线）
    restart: unless-stopped
    ports:
      - "8300:8300"
    environment:
      NODE_ENV: production
      PORT: "8300"
      # 容器内必须 0.0.0.0 才可被端口映射访问
      HOST: "0.0.0.0"
      # Windows/macOS Docker Desktop 自带 host.docker.internal；
      # Linux 靠 extra_hosts 的 host-gateway（下方已配，两边通用）
      BIT_BROWSER_API_URL: "http://host.docker.internal:54346"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ai-say-data:/app/data            # SQLite + 三层缓存 + 代理池（数据密钥绝不进镜像）
      - ./settings.json:/app/settings.json:ro   # 模型 apiKey（只读挂载，不进镜像）
    # 健康检查 = 轻量探针（task-9 修正）：只探「服务端口监听 + CDP 可达」，
    # 【绝不】打 /api/console/network/health（含平台风控归因，风控/平台不可用也非 200，
    # 打它会因平台风控误判不健康 → 重启风暴，反被守护放大；见 docs/GUARDIAN.md §5）。
    # /api/console/health = 纯只读：仅判断 服务活 + 8300 监听 + CDP 54346 TCP 可达，
    #   不调平台 / 不做风控归因 / 不读代理池；平台风控非 200 一律加白不归不健康。
    # 若 /api/console/health 未就绪，可先退化为 TCP 探：wget -q -O /dev/null http://127.0.0.1:8300/
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8300/api/console/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  ai-say-data:

# ------------------------------------------------------------------
