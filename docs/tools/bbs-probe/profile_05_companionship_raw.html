            <script>
    $(document).ready(function(){
        var dateId = 99;
        var meetId = 1;

        $('#dating1-'+dateId).prop('checked',true);
        $('#dating2-'+meetId).prop('checked',true);
    });

    function setCompanionship() {
        var date_hope = $("input[name='dating1']:checked").val();
        var meet_hope = $("input[name='dating2']:checked").val();

	    $.ajax({
		    type: "POST",
            url: '/config/settingprof/exec_companionship.html',
            data: {"dateId": date_hope, "meetId": meet_hope},
    	}).done(function(result){
	    	var results = splitPerl(result, ',', 2);
		    if ( results[0] == 1 ) {
                // プロフ確認・変更画面へ
                window.location.href = '/sns/snsmypage/show_profile.html';
		    } else {
			    // システムエラー表示
    			alert(results[1]);
	    		return false;
		    }
        });
	}

</script>
