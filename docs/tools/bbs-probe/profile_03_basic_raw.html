<script type="text/javascript">
$(document).ready(function(){

  // Rolldate
  const currentDate = moment();
  const startDate = currentDate.clone().subtract(18, 'years');
  var endDate = currentDate.clone().subtract(100, 'years').add(1, 'months');
  var input = document.getElementById('selectdate');
  var inValue = input.getAttribute('value');
  var dispDate = inValue;
  var isDefault = '';

  if (inValue == '') {
    $("#selectdate").val('未設定');
    dispDate = startDate.format("YYYY-MM");
  } else {
    var result = inValue.split('-').join('年');
    result = result + '月';
    $("#selectdate").val(result);
    isDefault = dispDate;
  }

  var lang = {
    title: 'あなたの誕生日',
    cancel: 'キャンセル',
    confirm: '完了',
    year: '年',
    month: '月',
    day: '日',
    hour: '时',
    min: '分',
    sec: '秒'
  };

  var rd = new Rolldate({
  el: '#input_date',
  format: 'YYYY-MM',
  minDate: endDate.format("YYYY-MM"),
  maxDate: startDate.format("YYYY-MM"),
  value:  dispDate,
  default: isDefault,
  lang: lang,

  confirm: function(date){
    var show_date = moment(date);
    dispDate = show_date.format("YYYY-MM");
    $("#selectdate").val(show_date.format("YYYY年MM月"));
	  $('#input_date').val(show_date.format("YYYY-MM"));
  },
  cancel: function() {
    if (inValue == '') {
      $("#selectdate").val('未設定');
      $("#input_date").val('');
      dispDate = startDate.format("YYYY-MM");
    } else {
      $("#input_date").val(dispDate);
    }
   }
  });
  
  $("#selectdate").click(function() {
    rd.show();
  });
}); 
</script>
